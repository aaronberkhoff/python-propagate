central_body: &earth !Earth
  flattening_bool: True

celestial_bodies:
 - &moon !Moon
   name: 'Moon'
   
  
 - &sun  !Sun
   name: 'Sun'
  


stations: 
    - &arecibo !Station
      name: 'Arecibo'
      lat_long_alt: [18.344, -66.752, 0.0]
      minimum_elevation_angle: 15.0
      identity: 0

scenario: &scenario !Scenario
  central_body: *earth
  start_time: "2025-03-03T0:00:00.0" 
  celestial_bodies: [*moon, *sun]
  duration: 
    days: 3
  dt: 
    seconds: 30
  name: 'Base'
  stations: [*arecibo]

agents: 
  - &sat1 !Spacecraft
    name: "GEO"
    start_time: "2025-01-15T12:30:00.0" # Can be arbitrary
    state: None # This will be populated by the TLE Forge
    dt: 
      seconds: 30
    duration: 
      days: 3 #Can bne arbitrary, this will be overridden by the TLE Forge if needed
    coefficient_of_drag: 2.0
    mass: 150.0 #kg
    area: 2.0 #m^2
    dynamics: ['kepler','J2','3body']
    scenario: *scenario


forge:
  !TLEForge
  name: "test_tle_forge" # Name of the TLE Forge instance
  database: data/rso_data/rso_data.db
  agent_base: *sat1
  norad_ids: 
    # - 41592
    - 37602
    - 42432
    - 49055
    # - 42740
    # - 40733
    # - 40272
  scenario: *scenario
  data_types:
     - 'RA_DEG'
     - 'DEC_DEG'
     - 'RANGE_KM' 
     - 'RANGE_RATE_KMS' 
     - 'AZ_DEG' 
     - 'EL_DEG'

     - 'X_INERTIAL_KM' 
     - 'Y_INERTIAL_KM' 
     - 'Z_INERTIAL_KM'
     - 'VX_INERTIAL_KMS' 
     - 'VY_INERTIAL_KMS' 
     - 'VZ_INERTIAL_KMS'

     - 'LAT_DEG'
     - 'LON_DEG'
     - 'ALT_KM'

  
  add_noise: False
  plots: ['orbital_elements','orbit','ground_track']
  output_directory: 'tests/results'
  output_types: ['h5','csv']



    




    

