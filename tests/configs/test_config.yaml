central_body: &earth !Earth
  flattening_bool: True

celestial_bodies:
 - &moon !Moon
   name: 'Moon'
 - &sun  !Sun
   name: 'Sun'


stations: 
    - &arecibo !Station
      name: 'Arecibo'
      lat_long_alt: [18.344, -66.752, 0.0]
      minimum_elevation_angle: 15.0
      identity: 0

scenario: &scenario !Scenario
  central_body: *earth
  start_time: "2025-01-15T12:30:00.0"
  celestial_bodies: [*moon, *sun]
  duration: 
    days: 3
  dt: 
    seconds: 30
  name: 'Base'
  stations: 
    # Stations can be used for ground tracking, etc.
    - *arecibo


manuevers: 
  - &manuever1 !ThrustManuever
    magnitude: -0.001 #km/s
    direction_ric: [0.0,1.0,0.0]
    execution_time: 
      days: 2
    execution_duration:
      minutes: 1
  - &manuever2 !ThrustManuever
      magnitude: 0.001 #km/s
      direction_ric: [0.0,1.0,0.0]
      execution_time: 
        days: 7
      execution_duration:
        minutes: 1


agents: 
  - &sat1 !Spacecraft
    name: "GEO_Sat1_nominal"
    start_time: "2025-01-15T12:30:00.0"
    state: !OrbitalElements
              sma: 42164
              ecc: 0.1
              inc: 30.0 
              arg: 1.0
              raan: 1.0
              nu: 180.0
    dt: 
      seconds: 30
    duration: 
      days: 3
    coefficient_of_drag: 2.0
    mass: 150.0 #kg
    area: 2.0 #m^2
    dynamics: ['kepler',complex_srp]
    scenario: *scenario
    # manuevers: [*manuever1]

  - &sat2 !Spacecraft
    name: "LEO_complex_drag"
    start_time: "2025-01-15T12:30:00.0"
    state: !OrbitalElements
              sma: 7700
              ecc: 0.1
              inc: 30.0 
              arg: 1.0
              raan: 1.0
              nu: 180.0
    dt: 
      seconds: 30
    duration: 
      days: 1
    coefficient_of_drag: 2.0
    mass: 150.0 #kg
    area: 2.0 #m^2
    dynamics: ['kepler','complex_drag']
    scenario: *scenario
    # manuevers: [*manuever1]

  - &sat3 !Spacecraft
    name: "LEO_drag"
    start_time: "2025-01-15T12:30:00.0"
    state: !OrbitalElements
              sma: 7700
              ecc: 0.1
              inc: 30.0 
              arg: 1.0
              raan: 1.0
              nu: 180.0
    dt: 
      seconds: 30
    duration: 
      days: 1
    coefficient_of_drag: 2.0
    mass: 150.0 #kg
    area: 2.0 #m^2
    dynamics: ['kepler','drag'] # Note: 'drag' is a simplified drag model, 'complex_drag' can be used for more complex models
    scenario: *scenario
    # manuevers: [*manuever1]

  - &sat4 !Spacecraft
    name: "LEO_srp_complex"
    start_time: "2025-01-15T12:30:00.0"
    state: !OrbitalElements
              sma: 7700
              ecc: 0.1
              inc: 30.0 
              arg: 1.0
              raan: 1.0
              nu: 180.0
    dt: 
      seconds: 30
    duration: 
      days: 1
    coefficient_of_drag: 2.0
    mass: 150.0 #kg
    area: 2.0 #m^2
    dynamics: ['kepler','complex_srp'] # Note: 'drag' is a simplified drag model, 'complex_drag' can be used for more complex models
    scenario: *scenario
    # manuevers: [*manuever1]

  - &sat5 !Spacecraft
    name: "LEO_baseline"
    start_time: "2025-01-15T12:30:00.0"
