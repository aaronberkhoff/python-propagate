central_body: &earth !Earth
  flattening_bool: True

celestial_bodies:
 - &moon !Moon
   name: 'Moon'
 - &sun  !Sun
   name: 'Sun'


stations: 
    - &arecibo !Station
      name: 'Arecibo'
      lat_long_alt: [18.344, -66.752, 0.0]
      minimum_elevation_angle: 15.0
      identity: 0

scenario: &scenario !Scenario
  central_body: *earth
  start_time: "2025-01-15T12:30:00.0"
  celestial_bodies: [*moon, *sun]
  duration: 
    days: 3
  dt: 
    seconds: 30
  name: 'Base'
  stations: 
    # Stations can be used for ground tracking, etc.
    - *arecibo


manuevers: 
  - &manuever1 !ThrustManuever
    magnitude: -0.001 #km/s
    direction_ric: [0.0,1.0,0.0]
    execution_time: 
      days: 2
    execution_duration:
      minutes: 1
  - &manuever2 !FreeRotate
      execution_time: 
        days: 2
      execution_duration:
        days: 1
  - &manuever3 !StationKeepLoss
      scenario: *scenario
      dynamics: ['J2','J3']
      execution_time: 
        days: 0
      execution_duration:
        days: 2

buses:
  - &bus1 !Bus
    name: "GEO_Sat1_bus"
    extents: [2.0, 2.0, 2.0] # Dimensions of the bus in meters (width, height, depth) (3 for a box)
    orientation: 'nadir' # Only supports Nadir 
    properties_file: "data/bus/default_properties.json" #File that defines the reflectivity and emissivity properties of the bus. This file can be found in the data directory of the package.    

agents: 
  - &sat1 !Spacecraft
    name: "GEO_tumble"
    start_time: "2025-01-15T12:30:00.0"
    state: !OrbitalElements
              sma: 42164
              ecc: 0.00001
              inc: 0.1 
              arg: 1.0
              raan: 1.0
              nu: 180.0
    dt: 
      seconds: 30
    duration: 
      days: 3
    coefficient_of_drag: 2.0
    mass: 150.0 #kg
    area: 2.0 #m^2
    dynamics: ['kepler','complex_srp']
    scenario: *scenario
    manuevers: [*manuever2]
    bus: *bus1 








    




    

