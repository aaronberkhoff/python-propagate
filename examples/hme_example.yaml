central_body: &earth !Earth
  flattening_bool: False

celestial_bodies:
 - &moon !Moon
   name: 'Moon'
 - &sun  !Sun
   name: 'Sun'


start_times:
  - &dec15 "2025-01-15T12:30:00.0"

sensors: 
  - &camera1 !Camera {noise_mean: [0,0], noise_covariance: [0,0], resolution: [1024,1024],reference_mag: 20, fov: 20, pointing_angles: [0,-27], background: 'dark'}

stations: 
  - &arecibo !Station {name: 'Arecibo', lat_long_alt: [18.344, -66.752, 0.0], minimum_elevation_angle: -90.0, identity: 0, sensor: *camera1}

scenarios: 
  - &scenario1 !Scenario {central_body: *earth, start_time: *dec15, duration: {days: 5}, dt: {seconds: 30}, name: 'Base', stations: [*arecibo], celestial_bodies: [*moon, *sun]}

manuevers: 
    #Thrust Manuever options

  # - &manuevertest !StationKeepLoss {scenario: *scenario1, dynamics: ['J2','J3'], execution_time: {days: 0}, execution_duration: {hours: 2}}
  
  - &manuever1 !ThrustManuever  {magnitude: -0.001, direction_ric: [0.0,1.0,0.0], execution_time: {days: 0}, execution_duration: {days: 10}}
  - &manuever2 !ThrustManuever  {magnitude:  -0.001, direction_ric: [0.0,0.0,1.0], execution_time: {days: 0}, execution_duration: {days: 10}}
  - &manuever3 !ThrustManuever  {magnitude:  0.001, direction_ric: [0.0,1.0,0.0], execution_time: {days: 0}, execution_duration: {days: 10}}
  - &manuever4 !ThrustManuever {magnitude:  0.001, direction_ric: [0.0,0.0,1.0], execution_time: {days: 0}, execution_duration: {days: 10}}
  - &manuever5 !StationKeepLoss {scenario: *scenario1, dynamics: ['J2','J3'], execution_time: {days: 0}, execution_duration: {days: 10}}

    #Attitude changing manuevers
  # - &manuever4 !FreeRotate  {execution_time: {days: 5}, execution_duration: {minutes: 1}}

manuevertest: &test_manuevers
  - &manuevertest1 !ThrustManuever  {magnitude: -0.001, direction_ric: [0.0,1.0,0.0], execution_time: {hours: 1}, execution_duration:  {minutes: 3}}
  - &manuevertest2 !ThrustManuever  {magnitude:  -0.001, direction_ric: [0.0,0.0,1.0], execution_time: {hours: 2}, execution_duration: {minutes: 3}}
  - &manuevertest3 !ThrustManuever  {magnitude:  0.001, direction_ric: [0.0,1.0,0.0], execution_time: {hours: 3}, execution_duration:  {minutes: 3}}
  - &manuevertest4 !ThrustManuever {magnitude:  0.001, direction_ric: [0.0,0.0,1.0], execution_time: {hours: 4}, execution_duration:   {minutes: 3}}
  - &manuevertest5 !StationKeepLoss {scenario: *scenario1, dynamics: ['J2','J3'], execution_time: {hours: 5}, execution_duration:      {hours: 1}}



#Define the agents in the simulation

#Agent bus
buses:
  - &busbox  !Bus {name: "box",  extents: [2.0, 2.0, 2.0], orientation: 'nadir', properties_file: "data/bus/default_properties.json"} # box     
  - &busrect !Bus {name: "rect", extents: [4.0, 2.0, 3.0], orientation: 'nadir', properties_file: "data/bus/default_properties.json"} # rectangular     

#Define the agents initial conditions

initial_conditions:
  - &geo2  !OrbitalElements {sma: 42164, ecc: 0.0, inc: 0.0001, arg: 0.0, raan: 0.0, nu: 180.0} 

#Define the individual agents in the simulation


experts: &experts
#     # Added manuever1 to the spacecraft
  - &anom1 !Expert { name: "Nominal", start_time: *dec15, state: *geo2, dt: {seconds: 30}, duration: {days: 1},
    coefficient_of_drag: 2.0, mass: 150.0, area: 4.0, dynamics: ['kepler'], scenario: *scenario1, bus: *busbox}

  - &anom2 !Expert { name: "Negative_In-Track_Thrust", start_time: *dec15, state: *geo2, dt: {seconds: 30}, duration: {days: 1},
    coefficient_of_drag: 2.0, mass: 150.0, area: 4.0, dynamics: ['kepler'], scenario: *scenario1, bus: *busbox, manuevers: [*manuever1]}

  - &anom3 !Expert { name: "Negative_Cross-Track_Thrust", start_time: *dec15, state: *geo2, dt: {seconds: 30}, duration: {days: 1},
    coefficient_of_drag: 2.0, mass: 150.0, area: 4.0, dynamics: ['kepler'], scenario: *scenario1, bus: *busbox, manuevers: [*manuever2]}

  - &anom4 !Expert { name: "Positive_In-Track_Thrust", start_time: *dec15, state: *geo2, dt: {seconds: 30}, duration: {days: 1},
    coefficient_of_drag: 2.0, mass: 150.0, area: 4.0, dynamics: ['kepler'], scenario: *scenario1, bus: *busbox, manuevers: [*manuever3]}

  - &anom5 !Expert { name: "Positive_Cross-Track_Thrust", start_time: *dec15, state: *geo2, dt: {seconds: 30}, duration: {days: 1},
    coefficient_of_drag: 2.0, mass: 150.0, area: 4.0, dynamics: ['kepler'], scenario: *scenario1, bus: *busbox, manuevers: [*manuever4]}

  - &anom6 !Expert { name: "Station_Keep_Loss", start_time: *dec15, state: *geo2, dt: {seconds: 30}, duration: {days: 1},
    coefficient_of_drag: 2.0, mass: 150.0, area: 4.0, dynamics: ['kepler'], scenario: *scenario1, bus: *busbox, manuevers: [*manuever5]}


validation: &validate
    # Added manuever1 to the spacecraft
  # - &valid1 !Spacecraft { name: "GEO_Sat2", start_time: *dec15, state: *geo2, dt: {seconds: 30}, duration: {days: 1},
  #   coefficient_of_drag: 2.0, mass: 150.0, area: 4.0, dynamics: ['kepler'], scenario: *scenario1, bus: *busbox, manuevers: [*manuevertest]}

  - &valid1 !Spacecraft { name: "GEO_Sat2", start_time: *dec15, state: *geo2, dt: {seconds: 30}, duration: {hours: 7},
    coefficient_of_drag: 2.0, mass: 150.0, area: 4.0, dynamics: ['kepler'], scenario: *scenario1, bus: *busbox, manuevers: *test_manuevers}

forges:
  #nominal geo case with 10 agents
  - &case1 !AstroForge {name: "case1", scenario: *scenario1, agents: [*valid1],
    data_types: ['RA_DEG', 'DEC_DEG', 'RANGE_KM', 'RANGE_RATE_KMS', 'AZ_DEG', 'EL_DEG', 'X_INERTIAL_KM','Y_INERTIAL_KM','Z_INERTIAL_KM',
                  'VX_INERTIAL_KMS','VY_INERTIAL_KMS','VZ_INERTIAL_KMS','LAT_DEG','LON_DEG','ALT_KM','FLUX_W_M2','FLUX_APPARENT_MAG'], 
    add_noise: False,
    plots: ['orbital_elements','orbit','ground_track'],
    output_directory: 'examples/hme/results/test1',
    output_types: ['h5','csv']}


cases_to_run: [*case1]
