central_body: &earth !Earth
  flattening_bool: False


manuevers: 
  - &manuever1 !ThrustManuever
    magnitude: -0.001 #km/s
    direction_ric: [0.0,1.0,0.0]
    execution_time: 
      days: 2
    execution_duration:
      minutes: 1
  - &manuever2 !ThrustManuever
      magnitude: 0.001 #km/s
      direction_ric: [0.0,1.0,0.0]
      execution_time: 
        days: 7
      execution_duration:
        minutes: 1


agents: 
  - &sat1 !Spacecraft
    name: "GEO_Sat1_nominal"
    start_time: "2025-01-15T12:30:00"
    # state: !State
    #           position: [-2012.990, -381.065, 6315.376]
    #           velocity: [5.439783, -5.965319, 1.33398]
    state: !OrbitalElements
              sma: 42164
              ecc: 0.0
              inc: 0.0001 
              arg: 0.0
              raan: 0.0
              nu: 180.0
    dt: 
      seconds: 30
    duration: 
      days: 10
    coefficient_of_drag: 2.0
    mass: 150.0 #kg
    area: 2.0 #m^2
    dynamics: ['kepler']


stations: 
    - &arecibo !Station
      name: 'Arecibo'
      lat_long_alt: [18.344, -66.752, 0.0]
      minimum_elevation_angle: 15.0
      identity: 0


scenario:
  !DataGenerator
  name: "Impulse_nominal"
  central_body: *earth
  agents: [*sat1]
  stations: [*arecibo]
  start_time: "2025-01-15T12:30:00"
  duration: 
    days: 10
  dt:
    seconds: 30
  data_types:
     - 'RA_DEG'
     - 'DEC_DEG'
     - 'RANGE_KM' 
     - 'RANGE_RATE_KMS' 
     - 'AZ_DEG' 
     - 'EL_DEG'
     - 'X_INERTIAL_KM' 
     - 'Y_INERTIAL_KM' 
     - 'Z_INERTIAL_KM'
     - 'VX_INERTIAL_KMS' 
     - 'VY_INERTIAL_KMS' 
     - 'VZ_INERTIAL_KMS'
  plots: ['ground_track','orbit']
  output_directory: 'examples/results'
  output_type: ['csv', 'h5']



    




    

