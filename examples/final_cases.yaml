#Agents in forge can be define in a Genes block to generate a range of agents
#However this is not necessary and the agents can be defined individually or in "packs"

# The forges define the cases
forges:
  #nominal geo case with 10 agents
  - &case1 !PhotoForge {name: "case1", scenario: *scenario1, agents: [*nominal],
    data_types: ['RA_DEG', 'DEC_DEG', 'RANGE_KM', 'RANGE_RATE_KMS', 'AZ_DEG', 'EL_DEG', 'X_INERTIAL_KM','Y_INERTIAL_KM','Z_INERTIAL_KM',
                  'VX_INERTIAL_KMS','VY_INERTIAL_KMS','VZ_INERTIAL_KMS','LAT_DEG','LON_DEG','ALT_KM','FLUX_W_M2','FLUX_APPARENT_MAG'], 
    add_noise: False,
    plots: [],
    output_directory: 'examples/builders/results/case1',
    output_types: ['h5','csv']}

  #9 nominal geo and 1 loss in station keeping
  - &case1_ls !PhotoForge {name: "case1_ls", scenario: *scenario1, agents: [*nom1,*nom2,*nom3,*nom4,*anom5,*nom6,*nom7,*nom8,*nom9,*nom10],
    data_types: ['RA_DEG', 'DEC_DEG', 'RANGE_KM', 'RANGE_RATE_KMS', 'AZ_DEG', 'EL_DEG', 'X_INERTIAL_KM','Y_INERTIAL_KM','Z_INERTIAL_KM',
                  'VX_INERTIAL_KMS','VY_INERTIAL_KMS','VZ_INERTIAL_KMS','LAT_DEG','LON_DEG','ALT_KM','FLUX_W_M2','FLUX_APPARENT_MAG'], 
    add_noise: False,
    plots: [],
    output_directory: 'examples/builders/results/case1_ls',
    output_types: ['h5','csv']}

  #9 nominal geo and 1 thrust manuever
  - &case2_ls !PhotoForge {name: "case2_ls", scenario: *scenario1, agents: [*nom1,*nom2,*nom3,*nom4,*nom5,*anom6,*nom7,*nom8,*nom9,*nom10],
    data_types: ['RA_DEG', 'DEC_DEG', 'RANGE_KM', 'RANGE_RATE_KMS', 'AZ_DEG', 'EL_DEG', 'X_INERTIAL_KM','Y_INERTIAL_KM','Z_INERTIAL_KM',
                  'VX_INERTIAL_KMS','VY_INERTIAL_KMS','VZ_INERTIAL_KMS','LAT_DEG','LON_DEG','ALT_KM','FLUX_W_M2','FLUX_APPARENT_MAG'],
    add_noise: False,
    plots: ['orbital_elements','orbit','ground_track','light_curve'],
    output_directory: 'examples/builders/results/case2_ls',
    output_types: ['h5','csv']}

  #4 nominal GEO, MEO, LEO satellites respectively
  - &case3 !PhotoForge {name: "case3", scenario: *scenario1, agents: [*leo_sat1,*leo_sat2,*leo_sat3,*leo_sat4,
                                                                      *meo_sat1,*meo_sat2,*meo_sat3,*meo_sat4,
                                                                      *geo_sat1,*geo_sat2,*geo_sat3,*geo_sat4],

    data_types: ['RA_DEG', 'DEC_DEG', 'RANGE_KM', 'RANGE_RATE_KMS', 'AZ_DEG', 'EL_DEG', 'X_INERTIAL_KM','Y_INERTIAL_KM','Z_INERTIAL_KM',
                  'VX_INERTIAL_KMS','VY_INERTIAL_KMS','VZ_INERTIAL_KMS','LAT_DEG','LON_DEG','ALT_KM','FLUX_W_M2','FLUX_APPARENT_MAG'],
    add_noise: False,
    plots: ['orbital_elements','orbit','ground_track','light_curve'],
    output_directory: 'examples/builders/results/case3',
    output_types: ['h5','csv']}

  #3 nominal GEO, MEO, LEO satellites respectively, 1 LEO, MEO, GEO with thrust manuevers
  - &case3_ls !PhotoForge {name: "case3_ls", scenario: *scenario1, agents: [*leo_sat1,*leo_sat2,*leo_sat3,*leo_anom,
                                                                            *meo_sat1,*meo_sat2,*meo_sat3,*meo_anom,
                                                                            *geo_sat1,*geo_sat2,*geo_sat3,*geo_anom],

    data_types: ['RA_DEG', 'DEC_DEG', 'RANGE_KM', 'RANGE_RATE_KMS', 'AZ_DEG', 'EL_DEG', 'X_INERTIAL_KM','Y_INERTIAL_KM','Z_INERTIAL_KM',
                  'VX_INERTIAL_KMS','VY_INERTIAL_KMS','VZ_INERTIAL_KMS','LAT_DEG','LON_DEG','ALT_KM','FLUX_W_M2','FLUX_APPARENT_MAG'],
    add_noise: False,
    plots: ['orbital_elements','orbit','ground_track','light_curve'],
    output_directory: 'examples/builders/results/case3_ls',
    output_types: ['h5','csv']}

  #Starlink case  
  # - &case4 !TLEForge 

  #EO/IR forge case with nominal MEO and LEO
  # - &case5 !EOIRForge

  #EO/IR forge case with anomaly MEO and LEO
  # - &case5_ls !EOIRForge
  


