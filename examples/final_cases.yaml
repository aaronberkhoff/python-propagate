central_body: &earth !Earth
  flattening_bool: False

celestial_bodies:
 - &moon !Moon
   name: 'Moon'
 - &sun  !Sun
   name: 'Sun'


start_times:
  - &dec15 "2025-01-15T12:30:00.0"
  - &dec17 "2025-01-17T12:30:00.0"

sensors: 
  - &camera1 !Camera {noise_mean: [0,0], noise_covariance: [0,0], resolution: [1024,1024],reference_mag: 20, fov: 20, pointing_angles: [0,-27], background: 'dark'}

stations: 
  - &arecibo !Station {name: 'Arecibo', lat_long_alt: [18.344, -66.752, 0.0], minimum_elevation_angle: -90.0, identity: 0, sensor: *camera1}
  - &kwaj !Station {name: 'Kwajalein', lat_long_alt: [8.717, 167.733, 0.0], minimum_elevation_angle: 15.0, identity: 1, sensor: *camera1}
  - &diego !Station {name: 'Diego Garcia', lat_long_alt: [-7.31333, 72.41111, 0.0], minimum_elevation_angle: 15.0, identity: 2, sensor: *camera1}

scenarios: 
  - &scenario1 !Scenario {central_body: *earth, start_time: *dec15, duration: {days: 10}, dt: {seconds: 60}, name: 'Base', stations: [*arecibo], celestial_bodies: [*moon, *sun]}
  - &scenario2 !Scenario {central_body: *earth, start_time: *dec15, duration: {days: 10}, dt: {seconds: 60}, name: 'Base', stations: [*kwaj]}
  - &scenario3 !Scenario {central_body: *earth, start_time: *dec15, duration: {days: 10}, dt: {seconds: 60}, name: 'Base', stations: [*diego]}

manuevers: 
    #Thrust Manuever options
  - &manuever1 !ThrustManuever  {magnitude: -0.001, direction_ric: [0.0,1.0,0.0], execution_time: {hours: 1}, execution_duration: {minutes: 1}}
  - &manuever2 !ThrustManuever  {magnitude:  0.001, direction_ric: [0.0,0.0,1.0], execution_time: {hours: 1}, execution_duration: {minutes: 1}}

    #Station keeping loss Manuever options
  - &manuever3 !StationKeepLoss {scenario: *scenario1, dynamics: ['J2','J3','3body','complex_srp'], execution_time: {hours: 1}, execution_duration: {hours: 12}}

    #Attitude changing manuevers
  - &manuever4 !FreeRotate  {execution_time: {days: 5}, execution_duration: {minutes: 1}}


#Define the agents in the simulation

#Agent bus
buses:
  - &busbox  !Bus {name: "box",  extents: [2.0, 2.0, 2.0], orientation: 'nadir', properties_file: "data/bus/default_properties.json"} # box     
  - &busrect !Bus {name: "rect", extents: [4.0, 2.0, 3.0], orientation: 'nadir', properties_file: "data/bus/default_properties.json"} # rectangular     

#Define the agents initial conditions

initial_conditions:
  - &geo1  !OrbitalElements {sma: 42164, ecc: 0.0, inc: 0.0001, arg: 0.0, raan: 0.0, nu: 180.0} 
  - &geo2  !OrbitalElements {sma: 42164, ecc: 0.0, inc: 0.0001, arg: 0.0, raan: 0.0, nu: 200.0} 
  - &geo3  !OrbitalElements {sma: 42164, ecc: 0.0, inc: 0.0001, arg: 0.0, raan: 0.0, nu: 220.0} 
  - &geo4  !OrbitalElements {sma: 42164, ecc: 0.0, inc: 0.0001, arg: 0.0, raan: 0.0, nu: 240.0} 
  - &geo5  !OrbitalElements {sma: 42164, ecc: 0.0, inc: 0.0001, arg: 0.0, raan: 0.0, nu: 260.0} 
  - &geo6  !OrbitalElements {sma: 42164, ecc: 0.0, inc: 0.0001, arg: 0.0, raan: 0.0, nu: 280.0} 
  - &geo7  !OrbitalElements {sma: 42164, ecc: 0.0, inc: 0.0001, arg: 0.0, raan: 0.0, nu: 300.0} 
  - &geo8  !OrbitalElements {sma: 42164, ecc: 0.0, inc: 0.0001, arg: 0.0, raan: 0.0, nu: 320.0} 
  - &geo9  !OrbitalElements {sma: 42164, ecc: 0.0, inc: 0.0001, arg: 0.0, raan: 0.0, nu: 340.0} 
  - &geo10 !OrbitalElements {sma: 42164, ecc: 0.0, inc: 0.0001, arg: 0.0, raan: 0.0, nu: 360.0} 

  - &meo1 !OrbitalElements {sma: 26560, ecc: 0.0, inc: 55.0, arg: 0.0, raan: 45.0, nu: 180.0} 
  - &meo2 !OrbitalElements {sma: 26560, ecc: 0.0, inc: 55.0, arg: 0.0, raan: 135.0, nu: 180.0} 
  - &meo3 !OrbitalElements {sma: 26560, ecc: 0.0, inc: 55.0, arg: 0.0, raan: 225.0, nu: 180.0} 
  - &meo4 !OrbitalElements {sma: 26560, ecc: 0.0, inc: 55.0, arg: 0.0, raan: 315.0, nu: 180.0} 

  - &leo1 !OrbitalElements {sma: 8000, ecc: 0.0, inc: 55.0, arg: 0.0, raan: 45.0, nu: 0.0} 
  - &leo2 !OrbitalElements {sma: 8000, ecc: 0.0, inc: 55.0, arg: 0.0, raan: 135.0, nu: 0.0} 
  - &leo3 !OrbitalElements {sma: 8000, ecc: 0.0, inc: 55.0, arg: 0.0, raan: 225.0, nu: 0.0} 
  - &leo4 !OrbitalElements {sma: 8000, ecc: 0.0, inc: 55.0, arg: 0.0, raan: 315.0, nu: 0.0} 
   

  - &sp_min !OrbitalElements {sma: 42000, ecc: 0.0001, inc: 0.0001, arg: 0.0, raan: 0.0, nu: 180.0} 
  - &sp_max !OrbitalElements {sma: 42200, ecc: 0.0002, inc: 0.001,  arg: 0.0, raan: 0.0,  nu: 190.0} 


