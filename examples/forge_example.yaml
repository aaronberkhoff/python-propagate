central_body: &earth !Earth
  flattening_bool: False


manuevers: 
  - &manuever1 !ThrustManuever
    magnitude: -0.001 #km/s
    direction_ric: [0.0,1.0,0.0]
    execution_time: 
      days: 2
    execution_duration:
      minutes: 1
  - &manuever2 !ThrustManuever
      magnitude: 0.001 #km/s
      direction_ric: [0.0,1.0,0.0]
      execution_time: 
        days: 7
      execution_duration:
        minutes: 1

stations: 
    - &arecibo !Station
      name: 'Arecibo'
      lat_long_alt: [18.344, -66.752, 0.0]
      minimum_elevation_angle: 15.0
      identity: 0

scenario: &scenario !Scenario
  central_body: *earth
  start_time: "2025-01-15T12:30:00" 
  duration: 
    days: 10
  dt: 
    seconds: 30
  name: 'Base'
  stations: [*arecibo]


agents: 
  - &sat1 !Spacecraft
    name: "GEO_Sat1_nominal"
    start_time: "2025-01-15T12:30:00"
    # state: !State
    #           position: [-2012.990, -381.065, 6315.376]
    #           velocity: [5.439783, -5.965319, 1.33398]
    state: !OrbitalElements
              sma: 42164
              ecc: 0.0
              inc: 0.0001 
              arg: 0.0
              raan: 0.0
              nu: 180.0
    dt: 
      seconds: 30
    duration: 
      days: 3
    coefficient_of_drag: 2.0
    mass: 150.0 #kg
    area: 2.0 #m^2
    dynamics: ['kepler']
    scenario: *scenario
    manuevers: [*manuever1]

#################################Start Genes#############################
gene_state: &gene_state !Gene
  attribute: "state"
  state_min: !OrbitalElements
              sma: 42164.0
              ecc: 0.0
              inc: 0.0001 
              arg: 0.0
              raan: 0.0
              nu: 110.0

  state_max: !OrbitalElements
              sma: 42164.0
              ecc: 0.0
              inc: 0.0001 
              arg: 0.0
              raan: 0.0
              nu: 180.0
  samples: 5
  agent_base: *sat1 

gene_mass: &gene_mass !Gene
  attribute: 'mass'
  mass_min: 50
  mass_max: 150
  samples: 5
  agent_base: *sat1 

gene_cd: &gene_cd !Gene
  attribute: 'coefficient_of_drag'
  coefficient_of_drag_min: 1.0
  coefficient_of_drag_max: 3.0
  samples: 11
  agent_base: *sat1 

gene_magnitude: &gene_magnitude !Gene
  attribute: 'magnitude'
  magnitude_min: -0.001
  magnitude_max: 0.001
  samples: 5
  agent_base: *sat1 

gene_direction_ric: &gene_direction_ric !Gene
  attribute: 'direction_ric'
  direction_ric_min: [0.0,1.0,-1.0]
  direction_ric_max: [0.0,1.0, 1.0]
  samples: 5
  agent_base: *sat1 
    

genes: !Genes &genes
  # genes: [*gene_state,*gene_mass]
  genes: [*gene_magnitude,*gene_direction_ric]
  # genes: [*gene_magnitude]

forge:
  !AstroForge
  name: "AstroForge"
  scenario: *scenario
  genes: *genes
  data_types:
     - 'RA_DEG'
     - 'DEC_DEG'
     - 'RANGE_KM' 
     - 'RANGE_RATE_KMS' 
     - 'AZ_DEG' 
     - 'EL_DEG'
     - 'X_INERTIAL_KM' 
     - 'Y_INERTIAL_KM' 
     - 'Z_INERTIAL_KM'
     - 'VX_INERTIAL_KMS' 
     - 'VY_INERTIAL_KMS' 
     - 'VZ_INERTIAL_KMS'
  plots: ['orbital_elements','orbit']
  output_directory: 'examples/results/AstroForgeExample'
  output_types: ['csv', 'h5']



    




    

